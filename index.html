<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[NOM DE MON ENTREPRISE] - Suivi de colis</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-surface min-h-screen flex flex-col font-sans">
    <header class="bg-primary text-white py-4 shadow-sm">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="font-bold text-xl tracking-tight">[NOM DE MON ENTREPRISE]</div>
            <nav class="hidden md:flex gap-6">
                <a href="/" class="hover:text-accent transition-colors">Accueil</a>
                <a href="/track" class="hover:text-accent transition-colors">Suivre un colis</a>
                <a href="/contact" class="hover:text-accent transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12 flex flex-col items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 max-w-2xl w-full text-center">
            <h1 class="text-3xl font-bold text-primary mb-4">Suivez votre expédition en temps réel</h1>
            <p class="text-slate-500 mb-8">Entrez votre numéro de suivi pour connaître l'état de votre livraison.</p>
            
            <form action="/track" method="GET" class="flex flex-col sm:flex-row gap-4 max-w-lg mx-auto">
                <input type="text" name="id" placeholder="Ex: COLIS-2026-00125" class="flex-grow px-4 py-3 rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none code-tracking" required>
                <button type="submit" class="bg-accent text-white px-6 py-3 rounded-lg font-semibold hover:bg-amber-600 transition-colors whitespace-nowrap shadow-sm">
                    Rechercher
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 mt-auto">
        <div class="container mx-auto px-4 text-center text-sm text-slate-500">
            <p>&copy; [À compléter] [NOM DE MON ENTREPRISE]. Tous droits réservés.</p>
            <div class="mt-4 flex justify-center gap-4">
                <a href="#" class="hover:text-primary">Mentions légales</a>
                <a href="#" class="hover:text-primary">Politique de confidentialité</a>
            </div>
        </div>
    </footer>
</body>
</html>
